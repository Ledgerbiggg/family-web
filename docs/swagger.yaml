basePath: /v1
definitions:
  common.Result:
    properties:
      code:
        type: string
      data: {}
      message:
        type: string
    type: object
  login.InviteDto:
    properties:
      description:
        description: 邀请描述
        type: string
      invitedAdmin:
        description: 是否邀请成为管理员
        type: boolean
      realName:
        description: 邀请人的真实姓名
        type: string
    required:
    - description
    - invitedAdmin
    - realName
    type: object
  login.InviteRegisterDto:
    properties:
      inviteUid:
        type: string
      realName:
        type: string
      username:
        type: string
    required:
    - inviteUid
    - realName
    - username
    type: object
  login.RegisterDto:
    properties:
      confirmPassword:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - confirmPassword
    - password
    - username
    type: object
  login.UserDto:
    properties:
      password:
        description: 必填，最小6个字符
        type: string
      username:
        description: 必填，最小3个字符，最大20个字符
        type: string
    required:
    - password
    - username
    type: object
  tag.TagDto:
    properties:
      description:
        description: 可选
        type: string
      id:
        type: integer
      name:
        description: 必填
        type: string
      type:
        description: 必填且必须在 0-3 之间
        maximum: 4
        minimum: 0
        type: integer
    required:
    - name
    - type
    type: object
host: localhost:8001
info:
  contact:
    email: ledgerbiggg@gmail.com
    name: Ledgerbiggg
    url: https://github.com/Ledgerbiggg/family-web/issues
  description: family-web-server API description
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: My family-web-server API
  version: "1.0"
paths:
  /album/{category}/photos:
    get:
      consumes:
      - application/json
      description: 通过相册分类id获取这个分类下面的所有照片信息
      parameters:
      - description: 分类的id
        in: path
        name: category
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Result'
      security:
      - BearerAuth: []
      summary: 相册分类照片获取
      tags:
      - album
  /album/category-list:
    get:
      consumes:
      - application/json
      description: 获取所有的相册分类详情
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Result'
      security:
      - BearerAuth: []
      summary: 获取所有的相册分类
      tags:
      - album
  /album/fresh-photo:
    get:
      consumes:
      - application/json
      description: 将数据库的照片同步到本地数据库存储
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Result'
      security:
      - BearerAuth: []
      summary: 同步照片
      tags:
      - album
  /album/photo:
    get:
      consumes:
      - application/json
      description: 获取某个相册的照片字节数据
      parameters:
      - description: 图片的ID
        in: query
        name: pid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Result'
      security:
      - BearerAuth: []
      summary: 获取照片数据
      tags:
      - album
  /captcha:
    get:
      consumes:
      - application/json
      description: 获取验证码的图片数据
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Result'
      summary: 获取验证码
      tags:
      - login
  /home/getTagsByType:
    get:
      consumes:
      - application/json
      description: 获取主页home中的卡片(根据角色)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Result'
      security:
      - BearerAuth: []
      summary: 获取主页home中的卡片
      tags:
      - home
  /invite/get-link:
    post:
      consumes:
      - application/json
      description: 邀请注册链接获取,其他人可以使用链接直接注册账号
      parameters:
      - description: 邀请信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/login.InviteDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Result'
      security:
      - BearerAuth: []
      summary: 邀请注册link获取
      tags:
      - invite
  /invite/info:
    get:
      consumes:
      - application/json
      description: 根据邀请的uuid获取邀请信息
      parameters:
      - description: 邀请uuid
        in: query
        name: uid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Result'
      security:
      - BearerAuth: []
      summary: 获取邀请link信息
      tags:
      - invite
  /invite/qr-code:
    get:
      consumes:
      - application/json
      description: 根据邀请link的uuid获取邀请二维码
      parameters:
      - description: 邀请uuid
        in: query
        name: uid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Result'
      security:
      - BearerAuth: []
      summary: 获取邀请二维码
      tags:
      - invite
  /invite/register:
    post:
      consumes:
      - application/json
      description: 使用邀请链接去注册(可以直接成为管理员)
      parameters:
      - description: 邀请注册信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/login.InviteRegisterDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Result'
      security:
      - BearerAuth: []
      summary: 使用邀请链接去注册
      tags:
      - invite
  /login:
    post:
      consumes:
      - application/json
      description: 使用验证码+账号+密码登录
      parameters:
      - description: 用户信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/login.UserDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Result'
      summary: 登录用户
      tags:
      - login
  /logout:
    post:
      consumes:
      - application/json
      description: 退出登录,清除token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Result'
      summary: 退出登录
      tags:
      - login
  /management/menus:
    get:
      description: 根据当前的用户角色去获取菜单侧边栏
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Result'
      summary: 获取管理页面的菜单
      tags:
      - management
  /register:
    post:
      consumes:
      - application/json
      description: 使用验证码+账号+密码+确认密码注册
      parameters:
      - description: 用户信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/login.RegisterDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Result'
      summary: 注册
      tags:
      - login
  /tags/{id}:
    delete:
      consumes:
      - application/json
      description: 根据 URL 中的 id 参数删除标签
      parameters:
      - description: 标签 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Result'
      security:
      - BearerAuth: []
      summary: 删除标签
      tags:
      - tag
  /tags/{type}:
    get:
      consumes:
      - application/json
      description: 根据 URL 中的 type 参数获取指定类型的标签
      parameters:
      - description: 标签类型,0 = 灰色,1 = 蓝色,2 = 绿色,3 = 红色
        in: path
        name: type
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Result'
      security:
      - BearerAuth: []
      summary: 获取指定类型的标签
      tags:
      - tag
  /tags/add:
    post:
      consumes:
      - application/json
      description: 添加新的标签
      parameters:
      - description: 标签信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tag.TagDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Result'
      security:
      - BearerAuth: []
      summary: 添加标签
      tags:
      - tag
  /tags/update:
    put:
      consumes:
      - application/json
      description: 更新现有的标签
      parameters:
      - description: 标签信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tag.TagDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Result'
      security:
      - BearerAuth: []
      summary: 更新标签
      tags:
      - tag
  /verify:
    post:
      consumes:
      - application/json
      description: 使用验证码+账号+真实姓名注册
      parameters:
      - description: 用户信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/login.RegisterDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Result'
      summary: 找回密码
      tags:
      - login
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
